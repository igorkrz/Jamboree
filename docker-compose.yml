services:
    app:
        build:
            context: ./
            dockerfile: docker/build/Dockerfile
            target: dev
        restart: always
        ports:
            - "80:8080"
            - "5173:5173"
        volumes:
            - ./:/app
        networks:
            - network
        expose:
            - "8080"
        environment:
            - APP_ENV=${APP_ENV}
            - MESSENGER_TRANSPORT_DSN=${MESSENGER_TRANSPORT_DSN}

    database:
        image: postgres:${DATABASE_VERSION:-16}-alpine
        restart: always
        environment:
            POSTGRES_DB: ${DATABASE_NAME:-app}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-!ChangeMe!}
            POSTGRES_USER: ${DATABASE_USER:-app}
        ports:
            - "5432:5432"
        volumes:
            - ./docker/db/data:/var/lib/postgresql/data:rw
        networks:
            - network
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER:-app} -d ${DATABASE_NAME:-app}" ]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 20s

    redis:
        image: redis:7-alpine
        container_name: redis
        restart: always
        command: [ "redis-server", "--appendonly", "yes" ]
        networks:
            - network
        expose:
            - "6379"

    worker:
        build:
            context: ./
            dockerfile: docker/build/Dockerfile
            target: dev
        restart: always
        command: php bin/console messenger:consume async -vv --memory-limit=128M --time-limit=3600
        depends_on:
            - redis
            - database
        networks:
            - network
        volumes:
            - ./:/app
        environment:
            - APP_ENV=${APP_ENV}
            - MESSENGER_TRANSPORT_DSN=${MESSENGER_TRANSPORT_DSN}
            - MESSENGER_CONSUMER_NAME=${HOSTNAME}

    mailer:
        container_name: mailer
        image: axllent/mailpit
        restart: always
        ports:
            - "1025"
            - "8025"
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
    database_data:

networks:
    network:
        driver: bridge
