disable_functions =
disable_classes =

max_execution_time = 120
max_input_time = 90
max_input_vars = 2000

error_reporting = E_ALL & ~E_USER_DEPRECATED & ~E_DEPRECATED & ~E_STRICT
display_errors = "On"
log_errors = "On"

#memory_limit = 512M
memory_limit = -1
post_max_size = 40M
upload_max_filesize = 40M

error_log=/var/www/var/log/php/error.log

[Date]
date.timezone = ${PHP_TIMEZONE}
