version: '3'

services:
  php:
    container_name: php
    build:
      context: .
      dockerfile: Dockerfile
      target: ${APP_ENV}-image
      args:
#        XDEBUG_ENABLED: ${XDEBUG_ENABLED}
        APP_ENV: ${APP_ENV}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "./docker/php/config/php.ini:/usr/local/etc/php/conf.d/php.ini:ro"
      - "./docker/php/config/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro"  ### NB: filenames other that www.conf are not effective on config merge on php-fpm start (edited)
#      - "./docker/php/config/xdebug.ini:/usr/local/etc/php/src/xdebug.ini:ro" ### ENABLE / DISABLE XDEBUG USING .ENV FILE
      - "./:/var/www:z"
      - "${SSH_AUTH_SOCK}:${SSH_AUTH_SOCK}"

    shm_size: 754M
    environment:
      - "DATABASE_URL=postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@database/${DATABASE_NAME}"

      - "APP_SECRET=${APP_SECRET}"
      - "APP_ENV=${APP_ENV}"
      - "APP_DEBUG=${APP_DEBUG}"

      - "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}"
      - "PHP_TIMEZONE=${TIMEZONE}"

      - "HOST_IP=${HOST_IP}"
      - "PHP_IDE_CONFIG=serverName=_"
      - "PHP_IDE_KEY=${PHP_IDE_KEY}"
      - "GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}"
#      - "XDEBUG_ENABLED=${XDEBUG_ENABLED}"

###> DATABASE CONTAINER ###
  database:
    container_name: database
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    ports:
      - "32769:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USER}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${DATABASE_NAME}", "-U", "${DATABASE_USER}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
#      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
       - ./docker/db/data:/var/lib/postgresql/data:rw

  # NGINX CONTAINER
  web:
    container_name: web
    build:
      context: ./docker/nginx
    volumes:
      - "./docker/nginx/config/default.conf:/etc/nginx/conf.d/default.conf"
      - "./docker/nginx/config/params.d:/etc/nginx/params.d:ro"
      - "./var/log/nginx:/var/log/nginx:z"
      - "./:/var/www:z"
    depends_on:
      - php
    ports:
      - "${PORT_PREFIX}80:80"
      - "${PORT_PREFIX}81:81"
    command: nginx -g 'daemon off;'

  mailer:
    container_name: mailer
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

